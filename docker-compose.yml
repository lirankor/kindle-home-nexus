services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3000"

  bridge:
    build: ./bridge
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8790:8790"
    environment:
      APP_URL: http://app:3000/
      PORT: "8790"
      WIDTH: "600"
      HEIGHT: "800"
      REFRESH_MS: "30000"
      KEY_SETTLE_MS: "200"
      PAGE_RELOAD_MS: "0"
    # Chromium needs more than Docker's default 64MB /dev/shm
    shm_size: "512m"
