services:
  app:
    build: .
    restart: unless-stopped
    # HA_* / IMMICH_* settings (see .env.example); optional so the demo still starts without it.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The bridge shares this network namespace, so its port is published here.
    ports:
      - "192.168.1.15:8790:8790"
      - "127.0.0.1:8790:8790"

  bridge:
    build: ./bridge
    restart: unless-stopped
    depends_on:
      - app
    # Share the app's network namespace: Chromium then loads http://127.0.0.1:3000,
    # which is exempt from its HTTPS-upgrade logic (plain hostnames like "app" are not).
    network_mode: "service:app"
    environment:
      APP_URL: http://127.0.0.1:3000/
      PORT: "8790"
      WIDTH: "600"
      HEIGHT: "800"
      REFRESH_MS: "30000"
      KEY_SETTLE_MS: "200"
      PAGE_RELOAD_MS: "0"
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
    # Chromium needs more than Docker's default 64MB /dev/shm
    shm_size: "512m"

networks:
  default:
    # Fixed subnet so a host firewall rule can allow this stack to reach Home Assistant:
    #   sudo ufw allow from 10.90.90.0/24 to any port 8123 proto tcp
    ipam:
      config:
        - subnet: 10.90.90.0/24
