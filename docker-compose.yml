services:
  app:
    build: .
    restart: unless-stopped
    # HA_* / IMMICH_* settings (see .env.example); optional so the demo still starts without it.
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Media state (Jellyfin queue, mixes, photo marks, radio position) and the resized-image cache survive rebuilds.
    # Runtime state lives in bind mounts under KINDLE_DATA_DIR (default ./data next to this file; set it in .env to
    # keep the state somewhere your backups cover).
    volumes:
      - ${KINDLE_DATA_DIR:-./data}/app-data:/data
    # Also on cover-forge's network (a separate compose project on this box) for generated station covers;
    # the bridge shares this namespace and so reaches it too. That network must exist (`docker compose up` in
    # /home/openclaw/cover-forge) or drop the line + COVER_FORGE_URL.
    networks:
      # Keep the default route (and so the source address HA's ufw rule sees, 10.90.90.0/24) on our own network.
      default:
        gw_priority: 1
      cover-forge: {}
    # The bridge shares this network namespace, so its port is published here.
    ports:
      - "192.168.1.15:8790:8790"
      - "127.0.0.1:8790:8790"
      # The app itself (TanStack server, :3000) for Home Assistant's voice bridge calls (/api/voice/*, bearer
      # VOICE_TOKEN). Loopback only: HA runs on the host network. The Kindle keeps using the bridge on :8790.
      - "127.0.0.1:8791:3000"

  bridge:
    build: ./bridge
    restart: unless-stopped
    depends_on:
      - app
    # Share the app's network namespace: Chromium then loads http://127.0.0.1:3000,
    # which is exempt from its HTTPS-upgrade logic (plain hostnames like "app" are not).
    network_mode: "service:app"
    environment:
      APP_URL: http://127.0.0.1:3000/
      PORT: "8790"
      WIDTH: "600"
      HEIGHT: "800"
      REFRESH_MS: "30000"
      KEY_SETTLE_MS: "200"
      PAGE_RELOAD_MS: "0"
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      # Kindle radio duty cycle / update schedule (same keys as the app's .env, see .env.example).
      RADIO_DUTY_ENABLED: ${RADIO_DUTY_ENABLED:-1}
      DAY_WAKE_MIN: ${DAY_WAKE_MIN:-10}
      NIGHT_START: ${NIGHT_START:-00:00}
      NIGHT_END: ${NIGHT_END:-06:00}
      NIGHT_WAKE_MIN: ${NIGHT_WAKE_MIN:-120}
      SLEEP_TZ: ${SLEEP_TZ:-Europe/Berlin}
    # Chromium needs more than Docker's default 64MB /dev/shm
    shm_size: "512m"

  # YTuner: vTuner replacement for the amp's NET RADIO input (see ytuner/README.md).
  # Reached via Caddy (host :80, Host *.vtuner.com) -> 127.0.0.1:8098 (was :8095, now Music Assistant's port); Pi-hole points *.vtuner.com at pop-os.
  ytuner:
    build: ./ytuner
    restart: unless-stopped
    ports:
      - "127.0.0.1:8098:80"
    volumes:
      - ${KINDLE_DATA_DIR:-./data}/ytuner-cache:/app/cache
      - ${KINDLE_DATA_DIR:-./data}/ytuner-db:/app/db
      # YTuner keeps the amp's bookmarks ("Favourites") in config/bookmark.xml next to the station list: a persistent
      # dir so a rebuild keeps them, with the versioned files bind-mounted read-only on top (edit + `docker compose restart ytuner`).
      - ${KINDLE_DATA_DIR:-./data}/ytuner-config:/app/config
      - ./ytuner/config/stations.yaml:/app/config/stations.yaml:ro
      - ./ytuner/config/avr.ini:/app/config/avr.ini:ro

  # https -> http stream relay for the amp's NET RADIO (see relay/README.md).
  relay:
    build: ./relay
    restart: unless-stopped
    ports:
      - "192.168.1.15:8792:8792"
    volumes:
      - ./src/data/radio-stations.json:/app/radio-stations.json:ro

networks:
  cover-forge:
    external: true
    name: cover-forge_default
  default:
    # Fixed subnet so a host firewall rule can allow this stack to reach Home Assistant:
    #   sudo ufw allow from 10.90.90.0/24 to any port 8123 proto tcp
    ipam:
      config:
        - subnet: 10.90.90.0/24
