get_queue:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: music_assistant
          domain: media_player
    offset:
      default: 0
      selector:
        number: { min: 0, max: 100000, mode: box }
    limit:
      default: 200
      selector:
        number: { min: 1, max: 500, mode: box }
play_index:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: music_assistant
          domain: media_player
    index:
      required: true
      selector:
        number: { min: 0, max: 100000, mode: box }
get_config:
seed:
  fields:
    config:
      selector:
        object:
    kept:
      selector:
        object:
    skipped:
      selector:
        object:
    force:
      default: false
      selector:
        boolean:
pick_photo:
  fields:
    previous_id:
      selector:
        text:
mark_photo:
  fields:
    photo_id:
      required: true
      selector:
        text:
    verdict:
      required: true
      selector:
        select:
          options: [keep, skip, clear]
get_marks:
set_output:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: music_assistant
          domain: media_player
move_queue:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: music_assistant
          domain: media_player
    source_player:
      selector:
        entity:
          integration: music_assistant
          domain: media_player
    auto_play:
      default: true
      selector:
        boolean:
sync_output:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: music_assistant
          domain: media_player
    leader:
      selector:
        entity:
          integration: music_assistant
          domain: media_player
    join:
      default: true
      selector:
        boolean:
