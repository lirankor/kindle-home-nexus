; Per-AVR menu/filter configuration (CommonAVRini=1 -> one file for all AVRs).
; Reference: https://github.com/coffeegreg/YTuner/blob/master/cfg/avr.ini
[Configuration]
INIVersion=1.0.2
Protocol=all-as-http

[MainMenu Items]
IdentifiersList=about;bookmarks;mystations;radiobrowser
LabelsList=*** YTuner ***;Favourites;My Stations;Radio Browser

[RadioBrowser Filtering]
AllowedTags=
NotAllowedTags=
AllowedCountries=
AllowedLanguages=
; The R-N500 plays MP3/AAC/WMA streams; no HLS, OGG or Opus.
AllowedCodecs=MP3,AAC,AAC+
NotAllowedCodecs=OGG,OPUS,HLS,FLAC
BitrateMax=
NotAllowedInName=
NotAllowedInURL=.m3u8

[RadioBrowser Sorting]
Order=votes
Reverse=1

[Translator]
Enable=0
Auto=0
LanguageCode=
ReplaceUTF8Latin1Supplement=1
ReplaceUTF8Latin1ExtendedA=1
ReplaceUTF8Latin1ExtendedB=1
