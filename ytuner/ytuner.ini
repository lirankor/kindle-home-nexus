; YTuner configuration for kindle-home-nexus (see ytuner/README.md).
; Reference: https://github.com/coffeegreg/YTuner/blob/master/cfg/ytuner.ini
[Configuration]
INIVersion=1.2.2
IPAddress=default
; The amp reaches us as http://radioyamaha.vtuner.com (Pi-hole override -> pop-os -> Caddy -> this container),
; so every URL we hand back to the amp must use that host, not the container IP.
ActAsHost=radioyamaha.vtuner.com
; vTuner-era AVRs cannot do HTTPS.
UseSSL=0
RedirectHTTPCode=302
; 0-None 1-Info 2-Warning 3-Error 4-Debug
MessageInfoLevel=4
IconSize=200
IconCache=1
IconEndPointExtension=
MyToken=0123456789ABCDEF
CommonAVRini=1
CacheFolderLocation=/app/cache
ConfigFolderLocation=/app/config
DBFolderLocation=/app/cache
DBLibFile=default

[MyStations]
Enable=1
MyStationsFile=stations.yaml
MyStationsAutoRefreshPeriod=0

[Radiobrowser]
Enable=1
RBAPIURL=http://all.api.radio-browser.info
RBPopularAndSearchStationsLimit=100
RBMinStationsPerCategory=1
RBUUIDsCacheTTL=0
RBUUIDsCacheAutoRefresh=0
RBCacheType=catPermMemDB
RBCacheTTL=0

[Bookmark]
Enable=1
CommonBookmark=1
BookmarkStationsLimit=100

[WebServer]
WebServerIPAddress=default
WebServerPort=80

; DNS is handled by Pi-hole on pop-os (dnsmasq address=/vtuner.com/192.168.1.15); no DNS server here.
[DNSServer]
Enable=0
DNSServerIPAddress=default
DNSServerPort=53
InterceptDNs=*.vtuner.com
DNSServers=1.1.1.1

[MaintenanceServer]
Enable=0
MaintenanceServerIPAddress=127.0.0.1
MaintenanceServerPort=8080
